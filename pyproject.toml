[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minivllm-inference-lab"
version = "0.1.0"
description = "Qwen3 inference experiments based on MinivLLM: KV scheduling, DFlash, CUDA Graph and multi-GPU deployment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "huggingface-hub==0.36.0",
  "safetensors==0.8.0",
  "xxhash==4.0.1",
  "numpy==2.2.6",
  "triton==3.5.1; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/qingzhai/mini-vLLM"
Upstream = "https://github.com/Wenyueh/MinivLLM"
